# Go API Gateway 本地演示配置
# 此配置专为新手本地演示设计：
#   - 使用 SQLite 数据库（无需安装 MySQL）
#   - 配置了静态后端（无需安装 etcd 即可演示代理转发）
#   - Redis 可选（没装也能跑，限流降级为本地模式）
# 环境变量覆盖前缀: GATEWAY_

server:
  data:
    host: "0.0.0.0"
    port: 8080          # 数据面端口：对外提供代理转发
    read_timeout: 10s
    write_timeout: 30s
    idle_timeout: 120s
    max_header_bytes: 1048576
  admin:
    host: "0.0.0.0"
    port: 8081          # 管理面端口：管理后台 API

config_store:
  driver: "sqlite"       # 使用 SQLite，零配置
  dsn: "./data/gateway.db"
  max_open_conns: 100
  max_idle_conns: 20
  conn_max_lifetime: 300s

etcd:
  endpoints:
    - "127.0.0.1:2379"
  dial_timeout: 5s
  auto_sync_interval: 60s

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  pool_size: 50
  min_idle_conns: 10
  max_idle_conns: 1000
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

# 静态后端配置：当 etcd 不可用时，网关从这里获取后端实例地址
# 这里指向本地测试后端（test-services，默认 9001 端口）
static_backends:
  test-service:
    - address: "127.0.0.1:9001"
      weight: 1

admin:
  auth:
    enabled: true
    default_username: "admin"
    tokens:
      - token: "admin-token-dev-001"   # 默认登录 Token，演示用
        username: "admin"

log:
  level: "info"        # debug/info/warn/error，想看详细日志可改成 debug
  format: "console"    # json / console，本地演示用 console 更易读
  output: "stdout"
  async: true

trace:
  enabled: true
  sampler: "always"
  sample_ratio: 0.1
  exporter: "stdout"
  otlp_endpoint: ""

ratelimit:
  prefetch_interval: 100ms
  prefetch_factor: 2
  global_refill_interval: 1s
  key_ttl: 3600s

circuitbreaker:
  event_channel: "gateway:circuit:events"

health:
  startup_duration: 60s
  check_interval: 10s
